# fly.toml app configuration file generated for toman-mafia on 2026-10-11T22:43:23Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'toman-mafia'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.health_check]
    path = '/healthz'
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
